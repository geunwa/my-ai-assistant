<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>떠날까 · 해외여행 검색 관심도 AI 비서</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 모양 재사용을 위한 SVG 모음 (화면에는 보이지 않음). 로고의 비행기와 같은 모양이다. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-plane" viewBox="10 4 56 46">
        <g transform="rotate(-24 39 26)" stroke="#378ADD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="m33 23-5-8q-1-2 1-2h4q2 0 3 2l7 8Z" fill="#85B7EB"/>
          <path d="m21 24-3-6h5q2 0 3 2l3 3h20c5 0 9 2.5 9 6s-4 5-9 5H32c-6 0-11-3-11-8Z" fill="#85B7EB"/>
          <path d="m42 32-7 8q-1 1-3 1h-4q-2 0-1-2l4-7" fill="#85B7EB"/>
          <circle cx="35" cy="28" r="1.75" fill="#378ADD" stroke="none"/>
          <circle cx="42" cy="28" r="1.75" fill="#378ADD" stroke="none"/>
          <circle cx="49" cy="28" r="1.75" fill="#FAC775" stroke="none"/>
        </g>
      </symbol>
      <symbol id="i-cloud" viewBox="0 0 64 40">
        <g fill="currentColor">
          <circle cx="18" cy="26" r="10"/>
          <circle cx="32" cy="18" r="13"/>
          <circle cx="46" cy="26" r="10"/>
          <rect x="18" y="26" width="28" height="10"/>
        </g>
      </symbol>
    </defs>
  </svg>

  <header class="topbar">
    <svg class="deco cloud c1" aria-hidden="true"><use href="#i-cloud"/></svg>
    <svg class="deco cloud c2" aria-hidden="true"><use href="#i-cloud"/></svg>
    <svg class="deco cloud c3" aria-hidden="true"><use href="#i-cloud"/></svg>
    <div class="topbar-inner">
      <div class="brand">
        <img class="logo" src="assets/logo.svg" alt="" width="48" height="48">
        <div>
          <h1>떠날까</h1>
          <p class="subtitle">해외여행 검색 관심도 AI 비서</p>
        </div>
      </div>
      <svg class="flightpath" viewBox="0 0 320 44" aria-hidden="true">
        <path d="M2 34C50 34 70 10 130 14S230 38 286 16" fill="none" stroke="#378ADD" stroke-opacity=".55"
              stroke-width="2" stroke-linecap="round" stroke-dasharray="1 7"/>
        <use href="#i-plane" x="276" y="0" width="38" height="32"/>
      </svg>
      <span id="server-status" class="badge badge-wait">서버 확인 중</span>
    </div>
  </header>

  <div id="wake-banner" class="banner" hidden>
    <span id="wake-text"></span>
    <button id="wake-retry" type="button" class="btn btn-ghost btn-small" hidden>다시 시도</button>
  </div>

  <div id="toast" class="toast" role="alert" hidden>
    <span id="toast-text"></span>
    <button id="toast-close" type="button" aria-label="닫기">×</button>
  </div>

  <nav class="tabs" aria-label="화면 선택">
    <button class="tab active" data-tab="chat" type="button">채팅</button>
    <button class="tab" data-tab="data" type="button">데이터 관리</button>
    <button class="tab" data-tab="history" type="button">대화 기록</button>
  </nav>

  <main>
    <!-- 채팅 + 데이터 요약 -->
    <section id="tab-chat" class="panel">
      <div class="chat-layout">
        <div class="card chat-card">
          <div class="card-head">
            <h2 id="chat-title">새 대화</h2>
            <button id="new-chat" type="button" class="btn btn-ghost">새 대화</button>
          </div>
          <div id="messages" class="messages" aria-live="polite"></div>
          <form id="chat-form" class="chat-form">
            <textarea id="chat-input" rows="2" maxlength="1000"
              placeholder="어디로 떠나볼지 물어보세요. 예: 요즘 해외여행 관심도 어때?"></textarea>
            <button id="chat-send" type="submit" class="btn btn-primary">보내기</button>
          </form>
        </div>

        <aside class="card summary-card">
          <div class="card-head"><h2>데이터 요약</h2></div>
          <p class="hint">단위: 점 (주간 검색 관심도 지수) · 기간 중 검색이 가장 많았던 주 = <span class="nowrap">100점</span> · 검색 횟수나 %가 아니에요</p>
          <div id="summary" class="summary"></div>
          <div class="chart-wrap">
            <div id="chart"></div>
          </div>
          <p class="source">출처: Google Trends · 검색어 '해외여행' · 대한민국 · 웹 검색 · 수집일 2026-11-09</p>
        </aside>
      </div>
    </section>

    <!-- 데이터 관리 -->
    <section id="tab-data" class="panel" hidden>
      <div class="card">
        <div class="card-head"><h2>데이터 추가</h2></div>
        <form id="add-form" class="add-form">
          <label>주 시작일<input id="add-date" type="date" required></label>
          <label>관심도 지수 (0~100점)<input id="add-value" type="number" min="0" max="100" step="any" required></label>
          <label class="grow">메모<input id="add-memo" type="text" maxlength="200" placeholder="선택"></label>
          <button type="submit" class="btn btn-primary">추가</button>
        </form>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>데이터 목록</h2>
          <div class="head-tools">
            <span id="data-count" class="muted"></span>
            <button id="export-csv" type="button" class="btn btn-ghost btn-small">CSV 내려받기</button>
            <button id="export-json" type="button" class="btn btn-ghost btn-small">JSON 내려받기</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>주 시작일</th><th>관심도 지수 (0~100점)</th><th>메모</th><th class="actions-col">관리</th></tr>
            </thead>
            <tbody id="data-body"></tbody>
          </table>
        </div>
        <div class="pager">
          <button id="page-prev" type="button" class="btn btn-ghost">이전</button>
          <span id="page-info" class="muted"></span>
          <button id="page-next" type="button" class="btn btn-ghost">다음</button>
        </div>
      </div>
    </section>

    <!-- 대화 기록 -->
    <section id="tab-history" class="panel" hidden>
      <div class="history-layout">
        <div class="card">
          <div class="card-head">
            <h2>대화 목록</h2>
            <button id="history-refresh" type="button" class="btn btn-ghost">새로고침</button>
          </div>
          <ul id="history-list" class="history-list"></ul>
        </div>
        <div class="card">
          <div class="card-head">
            <h2 id="preview-title">대화 내용</h2>
            <div id="preview-actions" class="btn-row" hidden>
              <button id="preview-continue" type="button" class="btn btn-primary">이어서 대화하기</button>
              <button id="preview-delete" type="button" class="btn btn-danger">삭제</button>
            </div>
          </div>
          <div id="preview" class="messages preview"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
